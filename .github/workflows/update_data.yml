# 每個美國交易日收盤後：更新資料 → 重跑 Tier 1 分析 → 提交結果
name: Update data

on:
  schedule:
    - cron: "30 23 * * 1-5"   # UTC 23:30（美東 19:30 / 18:30），週一至週五
  workflow_dispatch:           # 也可在 Actions 頁面手動觸發

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python src/fetch_data.py

      - name: Run analysis
        run: |
          python src/prepare.py
          python src/regressions.py
          python src/figures.py
          python src/descriptive.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/oil_bond_data.xlsx data/episodes.csv data/cpi_release_dates.csv results figures
          git diff --cached --quiet || git commit -m "data: auto update $(date -u +%F)"
          git push
